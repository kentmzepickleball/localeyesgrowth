<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 360" width="776" height="360" font-family="Inter,Helvetica,Arial">
<rect width="100%" height="100%" fill="#FAF6EF"/>
<rect x="0" y="0" width="776" height="5" fill="#C07A22"/>
<text x="28" y="36" font-size="20" font-weight="700" fill="#15140F">Here is our math</text>
<text x="28" y="60" font-family="InterT,Arial" font-size="12" fill="#6C6558">The exact formula behind the LocalEyes coffee cart pricing calculator.</text>
<rect x="28" y="74" width="720" height="44" rx="4" fill="#F0DFC4"/>
<text x="44" y="94" font-family="monospace" font-size="12.5" fill="#15140F">price = max(minimum, base + per-guest x guests + per-hour x hours)</text>
<text x="44" y="110" font-family="monospace" font-size="12.5" fill="#15140F">        x cart multiplier + travel + add-ons</text>
<rect x="28" y="123" width="720" height="26" fill="#1E3A31"/>
<text x="40" y="140" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#FAF6EF">Tier</text>
<text x="190" y="140" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#FAF6EF">Base</text>
<text x="320" y="140" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#FAF6EF">Per guest</text>
<text x="460" y="140" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#FAF6EF">Per hour</text>
<text x="600" y="140" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#FAF6EF">Minimum</text>
<text x="40" y="166" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#15140F">Value</text>
<text x="190" y="166" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$428</text>
<text x="320" y="166" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$3.48</text>
<text x="460" y="166" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$35</text>
<text x="600" y="166" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$525</text>
<rect x="28" y="175" width="720" height="26" fill="#FFFFFF"/>
<text x="40" y="192" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#15140F">Standard</text>
<text x="190" y="192" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$470</text>
<text x="320" y="192" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$5.00</text>
<text x="460" y="192" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$45</text>
<text x="600" y="192" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$700</text>
<text x="40" y="218" font-family="InterT,Arial" font-size="12.5" font-weight="700" fill="#15140F">Premium</text>
<text x="190" y="218" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$472</text>
<text x="320" y="218" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$8.12</text>
<text x="460" y="218" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$65</text>
<text x="600" y="218" font-family="InterT,Arial" font-size="12.5" font-weight="400" fill="#15140F">$950</text>
<rect x="28" y="262" width="720" height="52" rx="4" fill="#FFFFFF" stroke="#DDD3C2"/>
<text x="44" y="282" font-family="InterT,Arial" font-size="12" font-weight="700" fill="#15140F">Worked example: 100 guests, 2 hours, Standard tier</text>
<text x="44" y="301" font-family="monospace" font-size="12" fill="#1E3A31">$470 + ($5.00 x 100) + ($45 x 2) = $1,060</text>
<text x="392" y="301" font-family="InterT,Arial" font-size="11.5" fill="#6C6558">National median booking: $1,040   (+1.9%)</text>
<text x="28" y="344" font-size="12.5" fill="#6C6558" font-style="italic">Constants were fitted to benchmark event sizes, so this is a sanity check, not an independent validation.</text>
</svg>
