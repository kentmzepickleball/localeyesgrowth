<text x="238.5" y="76" text-anchor="middle" font-family="InterT,Arial" font-size="11" font-weight="700" fill="#15140F">median $1,040</text>
<text x="34" y="188" font-family="InterT,Arial" font-size="11.5" fill="#6C6558">Under $250 for a two-hour event means someone has not priced their own labour.</text>
<text x="28" y="236" font-size="12.5" fill="#6C6558" font-style="italic">Percentiles from the Flashquotes Coffee Catering Pricing Dataset 2023-2026, CC BY 4.0.</text>
