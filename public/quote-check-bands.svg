<text x="683.0" y="131" text-anchor="middle" font-family="InterT,Arial" font-size="8.5" fill="#FAF6EF">Multi-cart or multi-day</text>
<line x1="154.4" y1="142" x2="154.4" y2="150" stroke="#6C6558" stroke-width="1"/>
